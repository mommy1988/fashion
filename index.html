<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phối Đồ Cá Nhân trên Web</title>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f2f2f7; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #canvas-container { flex: 1; background: #ffffff; position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { border: 1px solid #e5e5ea; }
        .controls { padding: 16px; background: #ffffff; border-top: 1px solid #d1d1d6; display: flex; gap: 12px; justify-content: center; }
        .btn { height: 44px; padding: 0 20px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: #007aff; color: white; }
        .btn-success { background: #34c759; color: white; }
        .btn-danger { background: #ff3b30; color: white; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <!-- Tạo bảng ghim hình vuông cố định kích thước 500x500 để dễ quản lý trên cả web và điện thoại -->
        <canvas id="outfitCanvas" width="500" height="500"></canvas>
    </div>

    <div class="controls">
        <input type="file" id="imageLoader" accept="image/*" style="display: none;" onchange="handleImageUpload(this)">
        <button class="btn btn-primary" onclick="document.getElementById('imageLoader').click()">👕 Thêm đồ</button>
        <button class="btn btn-success" onclick="saveOutfit()">💾 Lưu bộ đồ</button>
        <button class="btn btn-danger" onclick="deleteSelected()">🗑️ Xóa món chọn</button>
    </div>

    <script>
        const canvas = new fabric.Canvas('outfitCanvas');

        function handleImageUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    fabric.Image.fromURL(e.target.result, function (img) {
                        img.scaleToWidth(180);
                        img.set({
                            left: 160,
                            top: 160,
                            cornerColor: '#007aff',
                            cornerSize: 12,
                            transparentCorners: false
                        });
                        canvas.add(img);
                        canvas.setActiveObject(img);
                        canvas.renderAll();
                    });
                };
                reader.readAsDataURL(input.files[0]);
                input.value = '';
            }
        }

        function deleteSelected() {
            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                canvas.remove(activeObject);
                canvas.discardActiveObject();
                canvas.renderAll();
            }
        }

        // Hàm mới: Tự động xuất bảng ghim thành file ảnh tải về máy
        function saveOutfit() {
            // Hủy chọn vật thể để khi chụp ảnh không bị dính các ô vuông điều khiển màu xanh
            canvas.discardActiveObject();
            canvas.renderAll();
            
            const dataURL = canvas.toDataURL({
                format: 'png',
                quality: 1.0
            });
            
            const link = document.createElement('a');
            link.download = 'bo-do-phoi-cua-toi.png';
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
