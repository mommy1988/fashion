<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phối Đồ Cá Nhân trên Web</title>
    <!-- Đổi sang đường link thư viện dự phòng mượt hơn cho điện thoại -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f2f2f7; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #canvas-container { flex: 1; background: #ffffff; position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { border: 1px solid #e5e5ea; background: #fafafa; }
        .controls { padding: 16px; background: #ffffff; border-top: 1px solid #d1d1d6; display: flex; gap: 12px; justify-content: center; }
        .btn { height: 48px; padding: 0 20px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: #007aff; color: white; flex: 2; }
        .btn-success { background: #34c759; color: white; flex: 1; }
        .btn-danger { background: #ff3b30; color: white; flex: 1; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <!-- Đã cố định khung hình vuông để đảm bảo ảnh luôn hiện đúng vị trí -->
        <canvas id="outfitCanvas" width="380" height="450"></canvas>
    </div>

    <div class="controls">
        <input type="file" id="imageLoader" accept="image/*" style="display: none;" onchange="handleImageUpload(this)">
        <button class="btn btn-primary" onclick="document.getElementById('imageLoader').click()">👕 Thêm đồ</button>
        <button class="btn btn-success" onclick="saveOutfit()">💾 Lưu</button>
        <button class="btn btn-danger" onclick="deleteSelected()">🗑️ Xóa</button>
    </div>

    <script>
        // Khởi tạo bảng ghim
        const canvas = new fabric.Canvas('outfitCanvas');

        function handleImageUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    // Tạo một đối tượng ảnh thuần của HTML trước để kiểm tra dữ liệu
                    const imgObj = new Image();
                    imgObj.src = e.target.result;
                    imgObj.onload = function () {
                        const fabricImg = new fabric.Image(imgObj);
                        // Tự động thu nhỏ ảnh lại để tránh bị vỡ hoặc văng ra ngoài khung nhìn
                        fabricImg.scaleToWidth(150);
                        fabricImg.set({
                            left: 100,
                            top: 150,
                            cornerColor: '#007aff',
                            cornerSize: 20,
                            transparentCorners: false,
                            hasRotatingPoint: true
                        });
                        canvas.add(fabricImg);
                        canvas.setActiveObject(fabricImg);
                        canvas.renderAll();
                    };
                };
                reader.readAsDataURL(input.files[0]);
                input.value = '';
            }
        }

        function deleteSelected() {
            const activeObject = canvas.getActiveObject();
            if (activeObject) {
                canvas.remove(activeObject);
                canvas.discardActiveObject();
                canvas.renderAll();
            }
        }

        function saveOutfit() {
            canvas.discardActiveObject();
            canvas.renderAll();
            const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });
            const link = document.createElement('a');
            link.download = 'bo-do-cua-toi.png';
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
